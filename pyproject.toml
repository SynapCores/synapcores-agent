[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapcores-agent"
version = "0.1.0"
description = "A framework-free AI agent whose brain (memory + RAG + tool routing + state) is SynapCores."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SynapCores" }]
keywords = ["ai", "agent", "rag", "memory", "vector", "synapcores", "mcp", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Intentionally ZERO runtime dependencies for the core agent — it talks to
# SynapCores over plain HTTP using only the Python standard library. That is the
# point: the brain is SynapCores, not a pile of framework packages. The browser
# chat widget adds aiohttp (see the [web] extra); the recorder adds Playwright.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Browser chat widget (python -m synapcores_agent chat): aiohttp server + WS.
web = ["aiohttp>=3.9"]
# Self-driving session recorder (scripts/record_chat.py).
record = ["aiohttp>=3.9", "playwright>=1.40"]

[project.scripts]
synapcores-agent = "synapcores_agent.__main__:main"

[project.urls]
Homepage = "https://synapcores.com"
Recipes = "https://synapcores.com/recipes/agents/"

[tool.setuptools.packages.find]
where = ["src"]
